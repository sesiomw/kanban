<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Kanban</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js" defer async>
    </script>
</head>
<body>
    <header>
        <h1>Basic Kanban</h1>
    </header>
    <div class="adicionar">
        <input type="text" placeholder="Digite a tarefa" required>
        <button type="button">Adicionar</button>
    </div>
    <div class="todo-column">
        <h2>A fazer</h2>
        <template>
            <div class="task-card">
                <span>Exemplo de tarefa</span>
                <button type="button">Mover para fazendo</button>
                <button class="excluir" type="button">Excluir</button>
            </div>
        </template>
    </div>
    <div class="doing-column">
        <h2>Fazendo</h2>
        <template>
            <div class="task-card">
                <span>Exemplo de tarefa</span>
                <button type="button">Mover para feito</button>
                <button type="button">Excluir</button>
            </div>
        </template>
    </div>
    <div class="done-column">
        <h2>Feito</h2>
        <template>
            <div class="task-card">
                <span>Exemplo de tarefa</span>
                <button type="button">Excluir</button>
            </div>
        </template>
    </div>
</body>
</html>
