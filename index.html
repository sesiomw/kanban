<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js" defer async>
    </script>
</head>
<body>
  <header>
    <h1>Kanban</h1>
  </header>

  <div class="adicionar">
    <input type="text" id="input-tarefa" placeholder="Digite a tarefa" required>
    <button type="button" id="adicionar">Adicionar</button>
  </div>

  <div class="kanban-board">
    <div class="coluna todo-column">
      <h2>A fazer</h2>
      <div class="cards-container"></div>
    </div>
    <div class="coluna doing-column">
      <h2>Fazendo</h2>
      <div class="cards-container"></div>
    </div>
    <div class="coluna done-column">
      <h2>Feito</h2>
      <div class="cards-container"></div>
    </div>
  </div>

  <template id="templateTarefa">
    <div class="task-card">
      <span class="task-title"></span>
      <div class="card-actions">
        <button type="button" class="move-left">←</button>
        <button type="button" class="move-right">→</button>
        <button type="button" class="excluir">✕</button>
      </div>
    </div>
  </template>
</body>
